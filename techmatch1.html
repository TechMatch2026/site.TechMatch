<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechMatch</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #f2f2f2;
    }

    .login {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px #ccc;
    }

    input, button {
      display: block;
      width: 250px;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
     cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="login">
    <h1>TechMatch</h1>
    <input type="text" placeholder="Nome do usuário" id="nome">
    <input type="email" placeholder="E-mail">
    <input type="password" placeholder="Senha">
    <button id="botao">Entrar</button>
  </div>


<script>
 
    let botao = document.getElementById("botao");

    botao.addEventListener("click", function() {
        window.location.href = "techmatch2.html";
    });
</script>
</body>
</html>
