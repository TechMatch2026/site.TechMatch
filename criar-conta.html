<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Criar conta - TechMatch</title>

    <link rel="icon" type="image/png" href="techmatch_robozinho.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px;
            font-family: Arial, Helvetica, sans-serif;
            color: #142326;
            background: #e8f8f7;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 5px;
            border: 8px solid #679f9f;
            border-radius: 12px;
            pointer-events: none;
        }

        .cadastro {
            position: relative;
            width: min(100%, 430px);
            padding: 38px 34px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 18px 55px rgba(26, 110, 118, 0.12);
        }

        .cadastro h1 {
            margin: 0 0 10px;
            color: #142326;
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -1px;
        }

        .cadastro h1::after {
            content: "";
            display: block;
            width: 54px;
            height: 4px;
            margin: 13px auto 25px;
            border-radius: 99px;
            background: linear-gradient(90deg, #00bdb6, #078de0);
        }

        input,
        button {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            margin: 12px 0;
            border-radius: 10px;
            font: inherit;
        }

        input {
            border: 1px solid #d6e7e8;
            outline: none;
            background: #f8fcfc;
            color: #142326;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #05aebc;
            box-shadow: 0 0 0 3px rgba(5, 174, 188, 0.13);
        }

        input::placeholder {
            color: #8a9b9e;
        }

        button {
            border: 0;
            color: white;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(110deg, #08bdb7, #078ee0);
            box-shadow: 0 5px 14px rgba(0, 158, 190, 0.18);
            transition: transform 0.18s, filter 0.18s;
        }

        button:hover {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .voltar {
            color: #087f91;
            border: 1px solid #d8eeee;
            background: #f5ffff;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            body::before {
                inset: 4px;
                border-width: 5px;
            }

            .cadastro {
                padding: 30px 22px;
            }

            .cadastro h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="cadastro">

        <h1>Criar conta</h1>

        <input type="text" id="nome" placeholder="Nome do usuário">

        <input type="email" id="email" placeholder="E-mail">

        <input type="password" id="senha" placeholder="Senha">

        <button id="cadastrar">Criar conta</button>

        <button class="voltar" onclick="window.location.href='index.html'">
            ← Voltar 
        </button>

    </div>


    <script>

        const botao = document.getElementById("cadastrar");

        botao.addEventListener("click", async function () {

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            if (nome === "" || email === "" || senha === "") {
                alert("Preencha todos os campos!");
                return;
            }

            try {

                const resposta = await fetch(
                    "https://techmatch-backend-bo92.onrender.com/api/Usuarios",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome: nome,
                            email: email,
                            senha: senha
                        })
                    }
                );

                const mensagem = await resposta.text();

                if (resposta.ok) {

                    alert("Conta criada com sucesso!");

                    window.location.href = "index.html";

                } else {

                    alert(mensagem);
                }

            } catch (erro) {

                alert("Não foi possível conectar ao servidor.");

                console.error(erro);
            }

        });

    </script>

</body>

</html>
