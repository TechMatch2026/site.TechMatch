<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>TechMatch</title>

    <link rel="icon" type="image/png" href="techmatch_robozinho.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px;
            font-family: Arial, Helvetica, sans-serif;
            color: #142326;
            background: #e8f8f7;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 5px;
            border: 8px solid #679f9f;
            border-radius: 12px;
            pointer-events: none;
        }

        .login {
            position: relative;
            width: min(100%, 430px);
            padding: 38px 34px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 18px 55px rgba(26, 110, 118, 0.12);
        }

        .login h1 {
            margin: 0 0 10px;
            color: #142326;
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -1px;
        }

        .login h1::after {
            content: "";
            display: block;
            width: 54px;
            height: 4px;
            margin: 13px auto 25px;
            border-radius: 99px;
            background: linear-gradient(90deg, #00bdb6, #078de0);
        }

        input,
        button {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            margin: 12px 0;
            border-radius: 10px;
            font: inherit;
        }

        input {
            border: 1px solid #d6e7e8;
            outline: none;
            background: #f8fcfc;
            color: #142326;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #05aebc;
            box-shadow: 0 0 0 3px rgba(5, 174, 188, 0.13);
        }

        input::placeholder {
            color: #8a9b9e;
        }

        button {
            border: 0;
            color: white;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(110deg, #08bdb7, #078ee0);
            box-shadow: 0 5px 14px rgba(0, 158, 190, 0.18);
            transition: transform 0.18s, filter 0.18s;
        }

        button:hover {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .criar {
            color: #087f91;
            border: 1px solid #d8eeee;
            background: #f5ffff;
            box-shadow: none;
        }

        .escondido {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            body::before {
                inset: 4px;
                border-width: 5px;
            }

            .login {
                padding: 30px 22px;
            }

            .login h1 {
                font-size: 29px;
            }
        }
    
        /* Tema TechMatch: preto + roxo neon */
        body {
            color: #f3edff;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(126, 34, 206, .24), transparent 55%),
                linear-gradient(135deg, #09090d, #120d1b 55%, #09090d);
        }
        body::before {
            border-color: #6d28d9;
            border-width: 2px;
            border-radius: 18px;
            box-shadow: inset 0 0 35px rgba(168, 85, 247, .05), 0 0 24px rgba(124, 58, 237, .12);
        }
        .login, .cadastro {
            background: linear-gradient(145deg, rgba(29, 22, 39, .97), rgba(17, 14, 23, .98));
            border: 1px solid #3c2b50;
            border-radius: 20px;
            box-shadow: 0 22px 70px rgba(0, 0, 0, .48), 0 0 35px rgba(126, 34, 206, .12);
        }
        .login h1, .cadastro h1 { color: #faf5ff; }
        .login h1::after, .cadastro h1::after {
            background: linear-gradient(90deg, #c084fc, #7c3aed);
            box-shadow: 0 0 14px rgba(168, 85, 247, .35);
        }
        input {
            background: #0d0b12;
            border: 1px solid #3a2b4b;
            color: #f5edff;
            border-radius: 10px;
        }
        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, .17);
        }
        input::placeholder { color: #92839f; }
        button {
            background: linear-gradient(110deg, #9333ea, #6d28d9);
            color: #fff;
            border: 1px solid rgba(216, 180, 254, .18);
            box-shadow: 0 7px 20px rgba(124, 58, 237, .22);
            border-radius: 10px;
        }
        button:hover {
            filter: brightness(1.15);
            box-shadow: 0 9px 24px rgba(168, 85, 247, .28);
        }
        .criar, .voltar {
            background: #1b1425;
            color: #d8b4fe;
            border: 1px solid #51356d;
            box-shadow: none;
        }
        .criar:hover, .voltar:hover { background: #2a1b3a; }
        @media (max-width: 480px) {
            body::before { border-width: 2px; }
        }

    </style>

</head>

<body>

    <div class="login">

        <h1>TechMatch</h1>

        <!-- PRIMEIRA ETAPA -->
        <div id="etapaUsuario">

            <input
                type="text"
                id="nome"
                placeholder="Nome do usuário"
            >

            <button id="verificarUsuario">
                Entrar
            </button>

            <button
                class="criar"
                onclick="window.location.href='criar-conta.html'"
            >
                Criar uma conta
            </button>

        </div>


        <!-- SEGUNDA ETAPA -->
        <div id="etapaLogin" class="escondido">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >

            <button id="confirmarLogin">
                Confirmar login
            </button>

        </div>

    </div>


    <script>

        const verificarUsuario =
            document.getElementById("verificarUsuario");

        const confirmarLogin =
            document.getElementById("confirmarLogin");


        // PRIMEIRO: VERIFICAR SE O USUÁRIO EXISTE

        verificarUsuario.addEventListener("click", async function () {

            const nome =
                document.getElementById("nome").value.trim();


            if (nome === "") {

                alert("Digite o nome do usuário!");

                return;
            }


            try {

                const resposta = await fetch(
                    "https://techmatch-backend-bo92.onrender.com/api/Usuarios/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome: nome,
                            email: "",
                            senha: ""
                        })
                    }
                );


                /*
                 * Aqui o backend pode responder:
                 *
                 * 404 = usuário não existe
                 * 401 = usuário existe, mas ainda falta
                 *      conferir e-mail e senha
                 */

                if (resposta.status === 404) {

                    alert("Usuário não encontrado.");

                    return;
                }


                // Usuário existe.
                // Agora mostramos e-mail e senha.

                document.getElementById("etapaUsuario")
                    .classList.add("escondido");

                document.getElementById("etapaLogin")
                    .classList.remove("escondido");

            }
            catch (erro) {

                alert("Não foi possível conectar ao servidor.");

                console.error(erro);
            }

        });


        // SEGUNDO: CONFERIR E-MAIL E SENHA

        confirmarLogin.addEventListener("click", async function () {

            const nome =
                document.getElementById("nome").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;


            if (email === "" || senha === "") {

                alert("Preencha o e-mail e a senha!");

                return;
            }


            try {

                const resposta = await fetch(
                    "https://techmatch-backend-bo92.onrender.com/api/Usuarios/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome: nome,
                            email: email,
                            senha: senha
                        })
                    }
                );


                if (resposta.ok) {

                    alert("Login realizado com sucesso!");

                    window.location.href =
                        "techmatchTelaInicial.html";

                }
                else {

                    const mensagem =
                        await resposta.text();

                    alert(mensagem);
                }

            }
            catch (erro) {

                alert("Não foi possível conectar ao servidor.");

                console.error(erro);
            }

        });

    </script>

</body>

</html>
