<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechMatch</title>
 <link rel="icon" type="image/png" href="techmatch_robozinho.png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #f2f2f2;
    }

    .login {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px #ccc;
    }

    input, button {
      display: block;
      width: 250px;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
     cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="login">
    <h1>TechMatch</h1>
   <input type="text" placeholder="Nome do usuário" id="nome">
<input type="password" placeholder="Senha" id="senha">
<input type="email" placeholder="E-mail" id="email">
<button id="botao">Cadastrar</button>
  </div>


<script>
    let botao = document.getElementById("botao");

    botao.addEventListener("click", async function () {

        let nome = document.getElementById("nome").value;
        let email = document.getElementById("email").value;
        let senha = document.getElementById("senha").value;

        let usuario = {
            nome: nome,
            email: email,
            senha: senha
        };

        try {
            let resposta = await fetch("https://localhost:7217/api/Usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(usuario)
            });

            if (resposta.ok) {
                alert("Usuário cadastrado com sucesso!");
                window.location.href = "techmatchTelaInicial.html";
            } else {
                let erro = await resposta.text();
                alert("Erro ao cadastrar: " + erro);
            }

        } catch (erro) {
            alert("Não foi possível conectar com a API.");
            console.log(erro);
        }
    });
</script>
</body>
</html>
