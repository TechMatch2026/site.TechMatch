<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechMatch</title>
  <link rel="icon" type="image/png" href="techmatch_robozinho.png">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #f2f2f2;
    }

    .login {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px #ccc;
    }

    input, button {
      display: block;
      width: 250px;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>TechMatch</h1>

    <input type="text" placeholder="Nome do usuário" id="nome">

    <input type="password" placeholder="Senha">

    <input type="email" placeholder="E-mail">

    <button id="botao">Entrar</button>
  </div>

  <script>
    let botao = document.getElementById("botao");

    botao.addEventListener("click", async function() {

        const nome = document.getElementById("nome").value;
        const senha = document.querySelector('input[type="password"]').value;
        const email = document.querySelector('input[type="email"]').value;

        if (nome === "" || senha === "" || email === "") {
            alert("Preencha todos os campos!");
            return;
        }

        try {
            const resposta = await fetch("https://techmatch-backend-bo92.onrender.com/api/Usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha
                })
            });

            if (resposta.ok) {
                alert("Usuário cadastrado com sucesso!");
                window.location.href = "techmatchTelaInicial.html";
            } else {
                const erro = await resposta.text();
                alert("Erro ao cadastrar: " + erro);
            }

        } catch (erro) {
            alert("Não foi possível conectar ao servidor.");
            console.error(erro);
        }
    });
  </script>

</body>
</html>
