<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>TechMatch</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
        }

        .grupo {
            margin-bottom: 40px;
        }

        .opcoes {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .peca {
            width: 200px;
            height: 180px;
            border: 3px solid transparent;
            cursor: pointer;
            padding: 20px;


        }

        .peca:hover {
            border: 3px solid gray;
        }

        .selecionada {
            border: 3px solid blue;
        }

        .peca img {
            width: 100%;
            height: 140px;
            object-fit: contain;
        }

        #resultado {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
        }
        .preco {
            display: flex;
    justify-content: center;
    gap: 5px;

color: lightgreen;
}

    </style>
</head>


<body>

    <h1>Monte seu pc com o TechMatch</h1>


   

    <div class="grupo">

        <h2>Processadores</h2>

        <div class="opcoes">

            <div class="peca"
                 id="processador1"
                 onclick="selecionarProcessador('LGA1150')">


                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFzdkDU8uqlOLHYliD4Lyu_96bQvFKAfQ1LWAk1M1fow&s=10"
                     alt="Processador 1"> <br>

                <p>Intel Core i5 4570</p> <br>
               <div class="preco">
               <p style="margin-top: -30px;">R$</p>
               <p style="margin-top: -30px;" id="precoProcessador1">143</p>
               </div>

            </div>


            <div class="peca"
                 id="processador2"
                 onclick="selecionarProcessador('AM4')">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4J03wVWULYSyQp3O8sfs2AyUA8MnYinUJTeMv7b8bCA&s=10"
                     alt="Processador 2">
                 
                <p>AMD Ryzen 5 4500</p>
               <div class="preco">
               <p style="margin-top: -15px;">R$</p>
                <p style="margin-top: -15px;" id="precoProcessador2">499.99</p>
               </div>
            </div>

        </div>

    </div>


    

    <div class="grupo">

        <h2>Placas-mãe</h2>

        <div class="opcoes">

            <div class="peca"
                 id="placa1"
                 onclick="selecionarPlaca('LGA1150')">

                <img src="https://lojaibyte.vteximg.com.br/arquivos/ids/185612-1200-1200/placa-mae-asrock-h81m-hg4-r4-0-lga-1150-com-vga-e-hdmi-40292-1-min.jpg?v=637237070239000000"
                     alt="Placa-mãe 1">

                <p>ASRock H81M-HG4</p>
                <div class="preco">
               <p style="margin-top:-10px;">R$</p>
                <p style="margin-top:-10px;" id="precoPlaca1">188.50</p>
               </div>

            </div>


            <div class="peca"
                 id="placa2"
                 onclick="selecionarPlaca('AM4')">

                <img src="https://images2.kabum.com.br/produtos/fotos/100672/placa-mae-asrock-b450m-steel-legend-amd-am4-matx-ddr4-90-mxb9y0-a0uayz_placa-mae-asrock-b450m-steel-legend-amd-am4-matx-ddr4-90-mxb9y0-a0uayz_1552586913_gg.jpg"
                     alt="Placa-mãe 2">

                <p>ASRock B450M Steel Legend</p>
                 <div class="preco">
               <p style="margin-top:-10px;">R$</p>
               <p style="margin-top:-10px;" id="precoPlaca2">699.99</p>
               </div>

            </div>

        </div>

    </div>


    

    <button onclick="verificar()">
        Verificar compatibilidade
    </button>


    <p id="resultado"></p>
     <div class="preco">
       <p id="total"></p>
     </div>

    <script>

        
        let processadorEscolhido = null;

        let precoProcessador = null;
        let precoPlaca = null;
        let total = precoProcessador + precoPlaca;



function selecionarProcessador(socket) {

    
    processadorEscolhido = socket;




    document.getElementById("processador1")
        .classList.remove("selecionada");

    document.getElementById("processador2")
        .classList.remove("selecionada");


  

    if (socket === "LGA1150") {

        document.getElementById("processador1")
            .classList.add("selecionada");

        precoProcessador = Number(
            document.getElementById("precoProcessador1").innerHTML
        );

    }

    else if (socket === "AM4") {

        document.getElementById("processador2")
            .classList.add("selecionada");

        precoProcessador = Number(
            document.getElementById("precoProcessador2").innerHTML
        );

    }
}




function selecionarPlaca(socket) {

    
    placaEscolhida = socket;




    document.getElementById("placa1")
        .classList.remove("selecionada");

    document.getElementById("placa2")
        .classList.remove("selecionada");




    if (socket === "LGA1150") {

        document.getElementById("placa1")
            .classList.add("selecionada");

        precoPlaca = Number(
            document.getElementById("precoPlaca1").innerHTML
        );

    }

    else if (socket === "AM4") {

        document.getElementById("placa2")
            .classList.add("selecionada");

        precoPlaca = Number(
            document.getElementById("precoPlaca2").innerHTML
        );

    }
}




function verificar() {

    let resultado = document.getElementById("resultado");


    // Verifica se o usuário escolheu as duas peças

    if (processadorEscolhido === null ||
        placaEscolhida === null) {

        resultado.innerHTML =
            "Escolha as peças";

        return;
    }




    if (processadorEscolhido === placaEscolhida) {

        resultado.innerHTML =
            "CPU e placa-mãe: Compatíveis";

    }

    else {

        resultado.innerHTML =
            "CPU e placa-mãe: Incompatíveis";

    }




    let total = precoProcessador + precoPlaca;



    document.getElementById("total").innerHTML =
        "R$ " + total;

}
    </script>

</body>

</html>
