    <meta charset="UTF-8">
    <title>TechMatch - Monte seu PC</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
            color: #081129;
        }

        header {
            background: #081129;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        header img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        header h1 {
            margin: 0;
        }

        header span {
            color: #62bff0;
        }

        .principal {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            text-align: center;
        }

        .principal h2 {
            color: #081129;
            font-size: 30px;
        }

        .principal > p {
            color: #667085;
        }

        .grupo {
            margin-top: 35px;
        }

        .grupo h2 {
            font-size: 22px;
            text-align: left;
            border-left: 5px solid #6c50fb;
            padding-left: 10px;
        }

        .opcoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .peca {
            background: white;
            width: auto;
            min-height: 250px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .peca:hover {
            border-color: #62bff0;
            transform: translateY(-3px);
        }

        .peca.selecionada {
            border: 3px solid #6c50fb;
            background: #f1efff;
        }

        .peca img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }

        .nome {
            font-weight: bold;
        }

        .preco {
            color: #fd7d01;
            font-size: 19px;
            font-weight: bold;
        }

        button {
            margin-top: 30px;
            padding: 13px 25px;
            background: #6c50fb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d620ff;
        }

        #resultado {
            margin-top: 25px;
            font-size: 17px;
            font-weight: bold;
        }

        #total {
            color: #6c50fb;
            font-size: 22px;
            font-weight: bold;
        }

        .rodape {
            margin-top: 40px;
            padding: 20px;
            background: #081129;
            color: white;
        }

        @media (max-width: 650px) {
            .opcoes {
                grid-template-columns: 1fr;
            }

            .peca {
                width: auto;
            }
        }
    </style>
</head>

    "JBL Quantum 200": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-xJ-kMFzyv8Eju1S6iCggu4SRCHxM23O32d9OgfUB0g&s=10",

};
const selecionados = {};

function dinheiro(v){ return v.toFixed(2).replace('.', ','); }

function criarCatalogo(){
    const div = document.getElementById('catalogo');
    Object.entries(catalogo).forEach(([categoria, lista]) => {
        const grupo = document.createElement('div');
        grupo.className = 'grupo';
        const titulo = {
            processador:'Processadores', placaMae:'Placas-mãe', ram:'Memórias RAM', armazenamento:'Armazenamento (HD/SSD)',
            gpu:'Placas de vídeo', fonte:'Fontes de alimentação', gabinete:'Gabinetes', mouse:'Mouse', teclado:'Teclados', som:'Caixas de som', headset:'Headsets'
        }[categoria];
        const obrigatorio = ['processador','placaMae','ram','armazenamento','gpu','fonte','gabinete'].includes(categoria);
        grupo.innerHTML = `<h2>${titulo} <span style="font-size:13px;color:${obrigatorio?'#20a878':'#667085'};">(${obrigatorio?'obrigatório':'opcional'})</span></h2><div class="opcoes" id="opcoes-${categoria}"></div>`;
        div.appendChild(grupo);
        const opcoes = grupo.querySelector('.opcoes');
        lista.forEach((peca, i) => {
            const card = document.createElement('div');
            card.className = 'peca';
            card.dataset.categoria = categoria;
            card.dataset.indice = i;
            const extra = detalhes(categoria, peca);
            const fotoProduto = imagensProdutos[peca.nome];
            const foto = fotoProduto && !fotoProduto.includes('loremflickr.com') ? fotoProduto : (imagens[categoria] || 'placeholder.png');
            card.innerHTML = `<img src="${foto}" alt="${peca.nome}" onerror="this.onerror=null;this.src='placeholder.png';"><p class="nome">${peca.nome}</p><p class="preco">R$ ${dinheiro(peca.preco)}</p>${extra}`;
            card.onclick = () => selecionar(categoria, i, card);
            opcoes.appendChild(card);
        });
    });
}

function detalhes(cat,p){
    if(cat==='processador') return `<small>Socket: ${p.socket} · TDP: ${p.tdp}W</small>`;
    if(cat==='placaMae') return `<small>Socket: ${p.socket} · ${p.ram} · ${p.formato}</small>`;
    if(cat==='ram') return `<small>${p.tipo} · ${p.capacidade}GB · ${p.frequencia}MHz</small>`;
    if(cat==='armazenamento') return `<small>${p.interface} · ${p.capacidade}GB · até ${p.velocidade}MB/s</small>`;
    if(cat==='gpu') return `<small>Consumo estimado: ${p.consumo}W</small>`;
    if(cat==='fonte') return `<small>Potência: ${p.potencia}W</small>`;
    if(cat==='gabinete') return `<small>Placa-mãe: ${p.suporta} · GPU até ${p.gpu}mm</small>`;
    return `<small>Periférico opcional</small>`;
}

function selecionar(cat, indice, card){
    document.querySelectorAll(`[data-categoria="${cat}"]`).forEach(c=>c.classList.remove('selecionada'));
    card.classList.add('selecionada');
    selecionados[cat] = catalogo[cat][indice];
    atualizarTotal();
}

function atualizarTotal(){
    let total = 0;
    Object.values(selecionados).forEach(p=> total += Number(p.preco || 0));
    document.getElementById('total').innerHTML = 'Total: R$ ' + dinheiro(total);
}

function compatibilidade(){
    const r=[];
    const cpu=selecionados.processador, placa=selecionados.placaMae, ram=selecionados.ram;
    const armazenamento=selecionados.armazenamento, gpu=selecionados.gpu, fonte=selecionados.fonte, gabinete=selecionados.gabinete;
    if(cpu.socket===placa.socket) r.push('✓ CPU e placa-mãe: compatíveis');
    else r.push('✕ CPU e placa-mãe: incompatíveis');
    if(ram.tipo===placa.ram) r.push('✓ Memória RAM e placa-mãe: compatíveis');
    else r.push('✕ Memória RAM e placa-mãe: incompatíveis');
    if(armazenamento.interface==='SATA' || placa.nvme) r.push('✓ HD/SSD e placa-mãe: compatíveis');
    else r.push('✕ SSD NVMe e placa-mãe: incompatíveis');
    const wattsNecessarios = Math.ceil((cpu.tdp + gpu.consumo + 120) * 1.25);
    if(fonte.potencia >= wattsNecessarios) r.push(`✓ Fonte: suficiente (${fonte.potencia}W · recomendado pelo TechMatch: ${wattsNecessarios}W)`);
    else r.push(`✕ Fonte: insuficiente (${fonte.potencia}W · recomendado pelo TechMatch: ${wattsNecessarios}W)`);
    if(gabinete.suporta.includes(placa.formato)) r.push('✓ Placa-mãe e gabinete: compatíveis');
    else r.push('✕ Placa-mãe e gabinete: incompatíveis');
    return r;
}

function verificar(){
    const obrigatorios=['processador','placaMae','ram','armazenamento','gpu','fonte','gabinete'];
    const faltando=obrigatorios.filter(c=>!selecionados[c]);
    const resultado=document.getElementById('resultado');
    if(faltando.length){
        resultado.innerHTML='<b>Escolha todas as peças obrigatórias.</b><br><small>Faltando: '+faltando.map(f=>({processador:'processador',placaMae:'placa-mãe',ram:'memória RAM',armazenamento:'armazenamento',gpu:'placa de vídeo',fonte:'fonte',gabinete:'gabinete'}[f])).join(', ')+'</small>';
        resultado.style.color='#fb3c87';
        return;
    }
    const testes=compatibilidade();
    const ok=testes.filter(x=>x.startsWith('✓')).length;
    const total=testes.length;
    resultado.innerHTML=`<h3>Resultado da montagem: ${ok}/${total} verificações OK</h3>` + testes.map(x=>`<p style="margin:7px 0;color:${x.startsWith('✓')?'#20a878':'#fb3c87'}">${x}</p>`).join('');
}

criarCatalogo();
</script>
